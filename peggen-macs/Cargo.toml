[package]
name = "peggen-macs"
version = "0.4.0"
edition = "2024"
description = "PEG parsers generated from annotated Rust enums and structs. (macros)"
license     = "MIT OR Apache-2.0"
keywords    = ["parser-tools", "parser", "compiler"]
repository  = "https://github.com/Y-jiji/peggen"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
regex = "1.10"
syn = { version = "2", features = ["full"] }
